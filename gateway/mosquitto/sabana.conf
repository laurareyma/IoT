# /etc/mosquitto/conf.d/sabana.conf — Broker local del gateway.
# Mosquitto 2 solo escucha en localhost por defecto: sin "listener 1883" el
# ESP32 no se puede conectar (en el Monitor Serie aparece "estado -2").
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Solo para una prueba rápida sin usuarios (NO dejar así):
#   allow_anonymous true   y comentar password_file y acl_file
